{% set name = "texttable" %}
{% set version = "1.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dc16ea6b35fbf5291ba6ef79d79e37d9b3ca6acd7bae3ca3450488d7c2e19c99

build:
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python

test:
  source_files:
    - tests.py
  imports:
    - texttable
  commands:
    - pip check
    - pytest -v tests.py
  requires:
    - pip
    - pytest

about:
  home: https://github.com/foutaise/texttable
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python module for creating simple ASCII tables
  description: texttable is a module to generate a formatted text table, using ASCII characters.
  doc_url: https://github.com/foutaise/texttable#documentation
  dev_url: https://github.com/foutaise/texttable

extra:
  recipe-maintainers:
    - williamjamir
    - nicoddemus
    - micknudsen
